<!DOCTYPE html>
<html lang="fr">
<head>
<script src="/js/handlers.js"></script>
<script src="/js/a11y.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Parents — Groupe Scolaire Elhadji Mountaga Djély</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232E; --ink-soft:#4B5B63;
    --primary:#164B41; --primary-dark:#0E332C; --primary-light:#1F6E5E;
    --accent:#C2410C; --accent-dark:#9A3412;
    --sky:#5296C5; --gold:#F2B134;
    --bg-soft:#F4F7F5; --line:#E1E8E4; --danger:#DC2626; --ok:#15803D;
  }
  *{box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg-soft);margin:0;padding:0;color:var(--ink);min-height:100vh}
  h1,h2,h3{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--primary-dark);margin:0}
  a{color:var(--primary-dark)}
  .top{max-width:900px;margin:0 auto;padding:18px 16px 0}
  .top a{font-weight:700;font-size:13px;text-decoration:none}

  /* ── Connexion ── */
  #login-wrap{max-width:420px;margin:60px auto;padding:0 16px}
  .card{background:#fff;border-radius:20px;padding:36px;box-shadow:0 20px 50px -25px rgba(22,35,46,.3);border:1px solid var(--line)}
  .card h1{font-size:21px;text-align:center;margin-bottom:4px}
  .sub{color:var(--ink-soft);font-size:13.5px;text-align:center;margin-bottom:24px}
  .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  label{font-size:12px;font-weight:600;color:#374151}
  input,select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;width:100%;background:#fff}
  button{padding:13px 18px;background:var(--accent);color:#fff;border:none;border-radius:999px;font-size:14.5px;font-weight:700;cursor:pointer}
  button:hover{background:var(--accent-dark)}
  button:disabled{opacity:.6;cursor:default}
  #login-err{display:none;background:#FEF2F2;color:var(--danger);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}

  /* ── Tableau de bord ── */
  #dash-wrap{display:none;max-width:900px;margin:0 auto;padding:20px 16px 60px}
  .dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}
  .dash-header h1{font-size:22px}
  #logout-btn{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);padding:9px 16px;font-size:13px}
  #logout-btn:hover{background:#fff;color:var(--danger)}

  .enfants-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .enfant-tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-soft)}
  .enfant-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

  .section-card{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;border:1px solid var(--line)}
  .section-card h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .empty{color:var(--ink-soft);font-size:13.5px;font-style:italic}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1.5px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line)}
  .note-val{font-weight:700}
  .note-bonne{color:var(--ok)} .note-moyenne{color:var(--gold)} .note-faible{color:var(--danger)}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .badge-just{background:#DCFCE7;color:var(--ok)} .badge-injust{background:#FEF2F2;color:var(--danger)}
  .moy-row{font-weight:700;background:var(--bg-soft)}

  .devoir-item{padding:12px 0;border-bottom:1px solid var(--line)}
  .devoir-item:last-child{border-bottom:none}
  .devoir-item .titre{font-weight:700;font-size:14px}
  .devoir-item .meta{color:var(--ink-soft);font-size:12px;margin-top:2px}

  #btn-imprimer{background:var(--primary);margin-top:6px}
  #btn-imprimer:hover{background:var(--primary-dark)}

  @media(max-width:600px){ .card{padding:26px 20px} }
  @media print{ #logout-btn,.enfants-tabs,#btn-imprimer,.top{display:none!important} }
</style>
</head>
<body>

<div class="top"><a href="/vitrine.html">← Retour au site de l'école</a></div>

<div id="login-wrap">
  <div class="card">
    <h1>👨‍👩‍👧 Espace Parents</h1>
    <p class="sub" id="nom-ecole-contexte" style="display:none;font-weight:700;color:var(--primary,#164B41);margin:-6px 0 10px"></p>
    <p class="sub">Suivez la scolarité de votre enfant : notes, absences, devoirs et bulletin.</p>

    <div style="display:flex;gap:8px;background:#F4F7F5;border-radius:999px;padding:4px;margin-bottom:18px">
      <button type="button" id="tab-btn-connexion" onclick="afficherOngletParent('connexion')" style="flex:1;padding:10px;border:none;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)">Se connecter</button>
      <button type="button" id="tab-btn-inscription" onclick="afficherOngletParent('inscription')" style="flex:1;padding:10px;border:none;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:#4B5563">Créer mon compte</button>
    </div>

    <div id="onglet-connexion">
      <div id="login-err"></div>
      <form id="login-form">
        <div class="fg"><label>Identifiant</label><input id="l-user" required autocomplete="username"></div>
        <div class="fg"><label>Mot de passe</label><input id="l-pass" type="password" required autocomplete="current-password"></div>
        <button type="submit" id="login-btn" style="width:100%">Se connecter</button>
      </form>
      <p style="font-size:12px;color:var(--ink-soft);margin-top:18px;text-align:center">Vos identifiants vous ont été communiqués par l'établissement, ou créés vous-même via « Créer mon compte ».</p>
    </div>

    <div id="onglet-inscription" style="display:none">
      <div id="inscription-err" style="display:none;background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px"></div>
      <div id="inscription-ok" style="display:none;text-align:center;padding:16px 4px">
        <div style="font-size:36px;margin-bottom:8px">✅</div>
        <p id="inscription-ok-texte" style="font-size:13.5px;color:var(--ink-soft,#4B5B63)"></p>
      </div>
      <form id="inscription-form">
        <div class="fg"><label>Votre nom complet</label><input id="i-nom" required></div>
        <div class="fg"><label>Matricule de votre enfant <span style="font-weight:400;color:#9CA3AF">(communiqué par l'école)</span></label><input id="i-matricule" required placeholder="ex : M000123"></div>
        <div class="fg"><label>Votre e-mail</label><input id="i-email" type="email" required></div>
        <div class="fg"><label>Identifiant souhaité</label><input id="i-user" required autocomplete="username"></div>
        <div class="fg"><label>Mot de passe</label><input id="i-pass" type="password" required minlength="8" placeholder="8 caractères min., lettres et chiffres" autocomplete="new-password"></div>
        <button type="submit" id="inscription-btn" style="width:100%">Créer mon compte</button>
      </form>
    </div>
  </div>
</div>

<div id="dash-wrap">
  <div class="dash-header">
    <h1>Bonjour <span id="dash-nom-parent"></span> 👋</h1>
    <button id="logout-btn">⎋ Déconnexion</button>
  </div>
  <div class="enfants-tabs" id="enfants-tabs"></div>
  <div id="messages-zone"></div>
  <div id="dash-contenu"></div>
</div>

<script src="/js/pages-publiques/espace-parents.js"></script></body>
</html>
