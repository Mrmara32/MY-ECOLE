<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos écoles — Gestion Scolaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232E; --ink-soft:#4B5B63;
    --primary:#164B41; --primary-dark:#0E332C;
    --accent:#F0703F; --accent-dark:#D8582A;
    --bg-soft:#F4F7F5; --line:#E1E8E4;
  }
  *{box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg-soft);margin:0;color:var(--ink)}
  h1,h2{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--primary-dark)}
  header{background:var(--primary-dark);color:#fff;padding:56px 16px 64px;text-align:center}
  header h1{color:#fff;font-size:28px;margin:0 0 10px}
  header p{color:#CFE0D9;font-size:15px;max-width:480px;margin:0 auto}
  main{max-width:900px;margin:-32px auto 60px;padding:0 16px}
  .search-bar{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 20px 50px -25px rgba(22,35,46,.35);border:1px solid var(--line);margin-bottom:28px}
  .search-bar input{width:100%;border:none;font-family:inherit;font-size:15px;outline:none;background:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .ecole-card{background:#fff;border-radius:16px;padding:22px;border:1px solid var(--line);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;transition:transform .15s, box-shadow .15s}
  .ecole-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px -20px rgba(22,35,46,.35)}
  .ecole-logo{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--bg-soft)}
  .ecole-logo-fallback{width:52px;height:52px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px}
  .ecole-nom{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--primary-dark)}
  .ecole-contact{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
  .ecole-cta{font-size:12.5px;font-weight:700;color:var(--accent);margin-top:auto}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
  .empty .icon{font-size:44px;margin-bottom:12px}
  footer{text-align:center;padding:30px 16px;font-size:12.5px;color:var(--ink-soft)}
  footer a{color:var(--primary);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>🏫 Trouvez le site de votre école</h1>
  <p>Parcourez les établissements présents sur la plateforme et accédez directement à leur site.</p>
</header>
<main>
  <div class="search-bar">
    <input type="text" id="recherche" placeholder="🔍 Rechercher une école par son nom…">
  </div>
  <div id="grid" class="grid"></div>
</main>
<footer>
  Vous gérez un établissement scolaire ? <a href="/inscription-ecole.html">Inscrivez votre école gratuitement →</a>
</footer>

<script>
let TOUTES_LES_ECOLES = [];

function initiales(nom) {
  return (nom || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(m => m[0]).join('').toUpperCase();
}

function carteEcole(e) {
  const logo = e.logo_url
    ? `<img class="ecole-logo" src="${e.logo_url}" alt="">`
    : `<div class="ecole-logo-fallback">${initiales(e.nom)}</div>`;
  const contact = [e.telephone_contact, e.email_contact].filter(Boolean).join(' · ');
  return `
    <a class="ecole-card" href="/ecole/${encodeURIComponent(e.code)}">
      ${logo}
      <div class="ecole-nom">${e.nom}</div>
      ${contact ? `<div class="ecole-contact">${contact}</div>` : ''}
      <div class="ecole-cta">Visiter le site →</div>
    </a>`;
}

function afficher(liste) {
  const grid = document.getElementById('grid');
  if (!liste.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">🔎</div>Aucune école ne correspond à votre recherche.</div>`;
    return;
  }
  grid.innerHTML = liste.map(carteEcole).join('');
}

async function charger() {
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('/api/ecoles/publique');
    TOUTES_LES_ECOLES = await res.json();
    if (!TOUTES_LES_ECOLES.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">🏫</div>Aucune école n'est encore inscrite sur la plateforme.</div>`;
      return;
    }
    afficher(TOUTES_LES_ECOLES);
  } catch (e) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Impossible de charger la liste des écoles pour le moment.</div>`;
  }
}

document.getElementById('recherche').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  afficher(q ? TOUTES_LES_ECOLES.filter(x => x.nom.toLowerCase().includes(q)) : TOUTES_LES_ECOLES);
});

charger();
</script>
</body>
</html>
