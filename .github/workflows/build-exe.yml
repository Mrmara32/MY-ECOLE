name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ['exe-*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller MY-ECOLE.spec --noconfirm
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/MY-ECOLE -DestinationPath MY-ECOLE-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MY-ECOLE-windows
          path: MY-ECOLE-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MY-ECOLE-windows.zip
      - name: Publier le zip sur la branche exe-build
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan exe-build
          git rm -rf . -q || true
          cp "$GITHUB_WORKSPACE/MY-ECOLE-windows.zip" .
          git add MY-ECOLE-windows.zip
          git commit -qm "Build exe"
          git push -f origin exe-build
