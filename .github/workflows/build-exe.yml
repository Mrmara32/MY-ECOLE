name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ['exe-*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller MY-ECOLE.spec --noconfirm
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/MY-ECOLE -DestinationPath MY-ECOLE-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MY-ECOLE-windows
          path: MY-ECOLE-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MY-ECOLE-windows.zip
