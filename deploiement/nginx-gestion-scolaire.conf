server {
    listen 80;
    listen [::]:80;
    server_name groupescolairemd.com www.groupescolairemd.com;

    client_max_body_size 25M;

    access_log /var/log/nginx/gestion-scolaire-access.log;
    error_log  /var/log/nginx/gestion-scolaire-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Après l'exécution de certbot (voir guide), ce fichier sera automatiquement
# complété par un second bloc "server" gérant le HTTPS (port 443) — ne pas
# s'inquiéter si son contenu change tout seul à ce moment-là.
